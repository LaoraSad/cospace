name: CI - Validaciones CoSpace

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint, Types & Prisma Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Validación de tipos TypeScript
        run: npx tsc --noEmit

      - name: Ejecutar linter
        run: npm run lint
